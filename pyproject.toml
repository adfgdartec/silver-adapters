[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-adapters"
version = "0.4.0"
description = "Backend, dataset, notebook, and remote-training bridge protocols for Silver."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = []
keywords = ["pytorch", "keras", "tensorflow", "pandas", "kaggle", "jupyter", "machine-learning", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
pytorch = ["torch>=1.9.0"]
tensorflow = ["tensorflow>=2.6.0"]
keras = ["tensorflow>=2.6.0"]
kaggle = ["kaggle>=1.5.0"]
jupyter = ["jupyter>=1.0.0", "nbformat>=5.0.0"]
pandas = ["pandas>=1.0.0"]
remote = ["requests>=2.25.0"]
huggingface = ["transformers>=4.30.0"]
all = [
    "torch>=1.9.0",
    "tensorflow>=2.6.0",
    "kaggle>=1.5.0",
    "jupyter>=1.0.0",
    "nbformat>=5.0.0",
    "pandas>=1.0.0",
    "requests>=2.25.0",
    "transformers>=4.30.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/adfgdartec/silver-adapters"
Repository = "https://github.com/adfgdartec/silver-adapters"
Issues = "https://github.com/adfgdartec/silver-adapters/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
